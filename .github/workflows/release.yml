name: release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The floor version the package claims to support, matching mise.toml.
      - run: uv run --python 3.11 --all-extras pytest
      - run: uv run --python 3.11 --all-extras ruff check .

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Refuse to release a tag that disagrees with pyproject
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          test "$tag" = "$version" || {
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          }
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
